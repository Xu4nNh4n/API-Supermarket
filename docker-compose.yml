services:
  # 1. NGINX - Reverse Proxy tiếp nhận toàn bộ request ở cổng 80
  nginx:
    image: nginx:alpine
    container_name: supermarket-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - supermarket-network

  # 2. SPRING BOOT - Backend chạy ngầm và kết nối trực tiếp MySQL trên máy Windows
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supermarket-backend
    restart: unless-stopped
    environment:
      # Kết nối trực tiếp vào MySQL cài sẵn trên máy Windows của bạn (port 3306)
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/supermarket_api?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - supermarket-network

networks:
  supermarket-network:
    driver: bridge
