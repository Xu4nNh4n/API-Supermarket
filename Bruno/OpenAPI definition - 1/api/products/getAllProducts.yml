info:
  name: getAllProducts
  type: http
  seq: 1
  tags:
    - product-controller

http:
  method: GET
  url: "{{baseUrl}}/api/products"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
    - name: sortBy
      value: productId
      type: query
    - name: sortDir
      value: asc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/products"
      method: GET
      params:
        - name: page
          value: "0"
          type: query
        - name: size
          value: "10"
          type: query
        - name: sortBy
          value: productId
          type: query
        - name: sortDir
          value: asc
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "content": [
              {
                "productId": 0,
                "productName": "",
                "skuCode": "",
                "price": 0,
                "stockQuantity": 0,
                "reorderPoint": 0,
                "expiryDate": "",
                "imageUrl": "",
                "isActive": false,
                "categoryId": 0,
                "supplierId": 0,
                "createAt": "",
                "updateAt": ""
              }
            ],
            "page": 0,
            "size": 0,
            "totalElements": 0,
            "totalPages": 0,
            "last": false
          }
